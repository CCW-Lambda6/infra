    cmd: "/opt/homebrew/bin/llama-server --port ${PORT} --model /AI/hfhome/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q6_K.gguf --ctx-size 32768 --n-gpu-layers 99 --jinja --cache-type-k q8_0 --cache-type-v q8_0 --threads 16"

